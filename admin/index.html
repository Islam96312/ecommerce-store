<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المتجر</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <nav class="bg-blue-600 text-white p-4">
    <h1 class="text-xl font-bold">🛍️ لوحة تحكم المتجر</h1>
  </nav>
  <div class="container mx-auto p-6">
    <div class="grid grid-cols-3 gap-4 mb-8">
      <div class="bg-white p-6 rounded-xl shadow text-center">
        <p class="text-3xl font-bold text-blue-600" id="total-orders">0</p>
        <p class="text-gray-500">إجمالي الطلبات</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow text-center">
        <p class="text-3xl font-bold text-green-600" id="total-revenue">0</p>
        <p class="text-gray-500">إجمالي المبيعات (ريال)</p>
      </div>
      <div class="bg-white p-6 rounded-xl shadow text-center">
        <p class="text-3xl font-bold text-purple-600" id="total-products">0</p>
        <p class="text-gray-500">عدد المنتجات</p>
      </div>
    </div>
    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-bold mb-4">آخر الطلبات</h2>
      <table class="w-full text-right">
        <thead><tr class="border-b">
          <th class="p-2">التاريخ</th>
          <th class="p-2">الإجمالي</th>
          <th class="p-2">الحالة</th>
          <th class="p-2">العميل</th>
          <th class="p-2">#</th>
        </tr></thead>
        <tbody id="orders-table"></tbody>
      </table>
    </div>
  </div>
  <script>
    const API = 'http://localhost:8000'
    async function loadData() {
      const [orders, products] = await Promise.all([
        fetch(`${API}/orders`).then(r=>r.json()),
        fetch(`${API}/products`).then(r=>r.json())
      ])
      document.getElementById('total-orders').textContent = orders.length
      document.getElementById('total-revenue').textContent = orders.reduce((s,o)=>s+o.total,0).toLocaleString()
      document.getElementById('total-products').textContent = products.length
      const tbody = document.getElementById('orders-table')
      tbody.innerHTML = orders.slice(-10).reverse().map(o => `
        <tr class="border-b hover:bg-gray-50">
          <td class="p-2">${new Date(o.created_at).toLocaleDateString('ar')}</td>
          <td class="p-2 font-bold">${o.total} ريال</td>
          <td class="p-2"><span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded">${o.status}</span></td>
          <td class="p-2">${o.name}</td>
          <td class="p-2 text-gray-400">${o.id.slice(0,8)}</td>
        </tr>`).join('')
    }
    loadData()
    setInterval(loadData, 30000)
  </script>
</body>
</html>
